name: Build OpenWrt for Redmi AX5 (Argon + OpenWrt)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否开启SSH连接'
        required: false
        default: 'false'
      clean:
        description: '清理之前的编译缓存'
        required: false
        default: 'true'

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: configs/redmi_ax5.config
  DIY_SH: diy-script.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_BIN_DIR: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google-chrome* dotnet*
        sudo apt-get -y autoremove --purge
        sudo apt-get clean
        df -h

    - name: Clone source code
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    - name: Load custom feeds
      run: |
        cd openwrt
        echo "src-git argon https://github.com/jerrykuku/luci-theme-argon.git" >> feeds.conf.default
        echo "src-git argon_config https://github.com/jerrykuku/luci-app-argon-config.git" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cd openwrt
        [ -e files ] || mkdir files
        cp -rf ../files/* files/
        rm -f .config
        cat ../$CONFIG_FILE >> .config
        make defconfig

    - name: DIY script
      run: |
        cd openwrt
        chmod +x ../$DIY_SH
        bash ../$DIY_SH

    - name: Download packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      id: compile
      run: |
        cd openwrt
        echo "开始编译, CPU核心数: $(nproc)"
        make -j$(nproc) || make -j1 V=s
        echo "编译完成"

    - name: Organize firmware files
      run: |
        cd openwrt/bin/targets/qualcommax/ipq60xx
        rm -rf packages
        rm -f *.sha256sums
        for file in *; do
          if [ -f "$file" ]; then
            mv "$file" "openwrt-qualcommax-ipq60xx-redmi_ax5-${file}"
          fi
        done
        sha256sum * > sha256sums.txt
        cd -
        mkdir -p firmware_output
        cp -rf openwrt/bin/targets/qualcommax/ipq60xx/* firmware_output/
        cp -rf openwrt/.config firmware_output/config.buildinfo

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: redmi-ax5-openwrt-argon-with-nand-factory
        path: firmware_output/*
