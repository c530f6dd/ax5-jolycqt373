name: Build Redmi AX5 (jolycqt373)

# 手动点击运行，或每天北京时间 04:00 自动编译一次
on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: configs/redmi_ax5.config
  DIY_SCRIPT: diy-script.sh
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
      - name: 释放磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024

      - name: 拉取本仓库
        uses: actions/checkout@main

      - name: 克隆源码
        run: |
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
          echo "OPENWRT_PATH=$PWD/openwrt" >> $GITHUB_ENV

      - name: 应用设备配置
        run: |
          cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行 jolycqt373 定制脚本
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/$DIY_SCRIPT

      - name: 载入自定义文件（banner / 首次启动设置）
        run: |
          [ -e files ] && cp -rf files openwrt/
          cd openwrt
          make defconfig

      - name: 下载依赖包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 上传固件
        uses: actions/upload-artifact@main
        with:
          name: redmi-ax5-jolycqt373
          path: openwrt/bin/targets/qualcommax/ipq60xx/*
