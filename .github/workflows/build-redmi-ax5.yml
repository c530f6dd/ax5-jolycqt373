name: Build OpenWrt for Redmi AX5 (Argon + OpenWrt)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clean:
        description: '清理编译缓存'
        required: false
        default: 'true'

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: configs/redmi_ax5.config
  DIY_SH: diy-script.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google-chrome* dotnet* || true
        sudo apt-get -y autoremove --purge || true
        sudo apt-get clean || true
        df -h

    - name: Clone source code
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        echo "OPENWRT_PATH=$GITHUB_WORKSPACE/openwrt" >> $GITHUB_ENV

    - name: Load custom feeds
      run: |
        cd openwrt
        echo "src-git argon https://github.com/jerrykuku/luci-theme-argon.git" >> feeds.conf.default
        echo "src-git argon_config https://github.com/jerrykuku/luci-app-argon-config.git" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cd openwrt
        [ -e files ] || mkdir files
        cp -rf ../files/* files/
        rm -f .config
        cat ../$CONFIG_FILE >> .config
        make defconfig

    - name: DIY script
      run: |
        cd openwrt
        chmod +x ../$DIY_SH
        bash ../$DIY_SH

    - name: Download packages
      run: |
        cd openwrt
        make download -j8 || true
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      run: |
        cd openwrt
        echo "开始编译, CPU核心数: $(nproc)"
        make -j$(nproc) || make -j1 V=s
        echo "编译完成"

    - name: Organize firmware files
      run: |
        mkdir -p $GITHUB_WORKSPACE/firmware_output
        cd openwrt/bin/targets/qualcommax/ipq60xx
        rm -rf packages
        echo "=== 原始产物 ==="
        ls -lh
        find . -maxdepth 1 -type f -exec cp -v {} $GITHUB_WORKSPACE/firmware_output/ \;
        cp $GITHUB_WORKSPACE/openwrt/.config $GITHUB_WORKSPACE/firmware_output/config.buildinfo
        cd $GITHUB_WORKSPACE/firmware_output
        sha256sum * > sha256sums.txt
        echo "=== 最终产物清单 ==="
        ls -lh

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: redmi-ax5-openwrt-argon-nand-factory
        path: firmware_output/*
